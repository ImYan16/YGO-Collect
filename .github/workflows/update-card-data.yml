name: Update Card Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: write

concurrency:
  group: card-data-update
  cancel-in-progress: false

jobs:
  update-card-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Test Perl updater parsers
        run: perl Tools/test_update_data.pl

      - name: Update released card data
        run: perl Tools/update_card_data.pl

      - name: Commit updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/tcg.json data/ae.json data/ocg.json
          if git diff --cached --quiet; then
            echo "No released card data changes to commit"
          else
            git commit -m "Update released card data"
            branch="$GITHUB_REF_NAME"
            for attempt in 1 2 3 4 5; do
              if ! git fetch origin "$branch"; then
                echo "Fetch failed on push attempt $attempt."
              elif ! git rebase "origin/$branch"; then
                git rebase --abort || true
                echo "Unable to rebase generated card data; resolve the conflict before retrying."
                exit 1
              elif git push origin "HEAD:$branch"; then
                exit 0
              else
                echo "Push rejected on attempt $attempt; retrying with the latest branch."
              fi
              if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 2))"; fi
            done
            echo "Unable to push generated card data after 5 attempts."
            exit 1
          fi
