name: Update TCG Corner prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

permissions:
  contents: write

concurrency:
  group: price-data-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install Perl dependencies
        run: sudo apt-get update && sudo apt-get install --yes perl curl

      - name: Test price title parsing
        run: perl Tools/test_price_updater.pl

      - name: Harvest TCG Corner prices
        run: perl Tools/ae-prices-tcgcorner.pl

      - name: Harvest Players Club prices
        run: perl Tools/pl-prices-playersclub.pl

      - name: Harvest Players Club OCG prices
        run: perl Tools/pl-prices-playersclub-ocg.pl

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcgc-prices.json playersclub-prices.json playersclub-prices-ocg.json
          if [ -f Tools/played-stock.json ]; then git add Tools/played-stock.json; fi
          if git diff --cached --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "Update TCG Corner prices"
            branch="$GITHUB_REF_NAME"
            for attempt in 1 2 3 4 5; do
              if ! git fetch origin "$branch"; then
                echo "Fetch failed on push attempt $attempt."
              elif ! git rebase "origin/$branch"; then
                git rebase --abort || true
                echo "Unable to rebase generated price data; resolve the conflict before retrying."
                exit 1
              elif git push origin "HEAD:$branch"; then
                exit 0
              else
                echo "Push rejected on attempt $attempt; retrying with the latest branch."
              fi
              if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 2))"; fi
            done
            echo "Unable to push generated price data after 5 attempts."
            exit 1
          fi
