name: YuYuTei Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: yuyutei-data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes perl libwww-perl liblwp-protocol-https-perl liburi-perl

      - name: Check Perl syntax
        run: |
          perl -c Tools/yuyutei.pl

      - name: Run YuYuTei scraper
        working-directory: Tools
        run: |
          perl yuyutei.pl

      - name: Check output
        run: |
          test -s Tools/yuyutei.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Tools/yuyutei.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update YuYuTei data"
            git push
          fi
