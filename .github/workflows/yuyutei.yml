name: YuYuTei Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: yuyutei-data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes perl libwww-perl liblwp-protocol-https-perl liburi-perl

      - name: Check Perl syntax
        run: |
          perl -c Tools/yuyutei.pl

      - name: Run YuYuTei scraper
        working-directory: Tools
        run: |
          perl yuyutei.pl

      - name: Check output
        run: |
          test -s Tools/yuyutei.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Tools/yuyutei.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update YuYuTei data"
            branch="$GITHUB_REF_NAME"
            for attempt in 1 2 3 4 5; do
              if ! git fetch origin "$branch"; then
                echo "Fetch failed on push attempt $attempt."
              elif ! git rebase "origin/$branch"; then
                git rebase --abort || true
                echo "Unable to rebase generated YuYuTei data; resolve the conflict before retrying."
                exit 1
              elif git push origin "HEAD:$branch"; then
                exit 0
              else
                echo "Push rejected on attempt $attempt; retrying with the latest branch."
              fi
              if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 2))"; fi
            done
            echo "Unable to push generated YuYuTei data after 5 attempts."
            exit 1
          fi
