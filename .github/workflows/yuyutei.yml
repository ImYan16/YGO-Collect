name: YuYuTei Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install dependencies
        run: |
          cpanm --notest LWP::UserAgent
          cpanm --notest URI

      - name: Run YuYuTei scraper
        run: |
          perl Tools/yuyutei.pl

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Tools/yuyutei.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update YuYuTei data"
            git push
          fi
